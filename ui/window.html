<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="window.css" />
  <title>Subtitle Navigator</title>
</head>
<body>
  <div class="toolbar">
    <div class="row">
      <label class="lbl">Subtitle</label>
      <select id="track"></select>
    </div>
    <button id="reload">Reload</button>
  </div>

  <div class="find">
    <button id="toggleReplace" class="findToggle" title="Toggle Replace" aria-expanded="false">
      <span class="chev">&#8250;</span>
    </button>
    <div class="findRows">
      <div class="findRow">
        <input id="q" placeholder="Search..." />
        <button id="caseToggle" class="toggleBtn" title="Match case" aria-pressed="false">Aa</button>
        <span id="matchCount" class="findCount"></span>
        <button id="prevMatch" class="iconBtn" title="Previous match (Shift+Enter)" disabled>&#8593;</button>
        <button id="nextMatch" class="iconBtn" title="Next match (Enter)" disabled>&#8595;</button>
      </div>
      <div class="findRow" id="replaceRow" hidden>
        <input id="replaceWith" placeholder="Replace with..." />
        <button id="replaceOne" title="Replace this match (Enter)" disabled>Replace</button>
      </div>
    </div>
  </div>

  <div class="toolbar2">
    <button id="undo" title="Undo (⌘Z)" disabled>Undo</button>
    <button id="redo" title="Redo (⇧⌘Z)" disabled>Redo</button>
    <span class="sep"></span>
    <button id="scrollCurrent">Scroll to Current</button>
    <label class="chk"><input type="checkbox" id="autoScrollToggle"> Auto-scroll</label>
  </div>

  <div class="hint">Right-click a line for edit, jump, loop and copy actions. While editing: Enter commits, Shift+Enter adds a newline, Escape cancels. ⌘Z undoes edits and replacements.</div>

  <div id="notice" class="notice" hidden></div>
  <div id="meta" class="meta"></div>
  <div id="list" class="list"></div>

  <div id="ctxMenu" class="ctxMenu" hidden></div>

  <script src="window.js"></script>
</body>
</html>
