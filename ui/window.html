<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="window.css" />
  <title>Subtitle Navigator</title>
</head>
<body>
  <div class="toolbar">
    <div class="row">
      <label class="lbl">Subtitle</label>
      <select id="track"></select>
    </div>
    <div class="row grow">
      <input id="q" placeholder="Search..." />
    </div>
    <button id="reload">Reload</button>
  </div>

  <div class="toolbar2">
    <button id="scrollCurrent">Scroll to Current</button>
    <label class="chk"><input type="checkbox" id="autoScrollToggle"> Auto-scroll</label>
  </div>

  <div class="hint">Right-click a line for edit, jump, loop and copy actions. While editing: Enter commits, Shift+Enter adds a newline, Escape cancels.</div>

  <div id="notice" class="notice" hidden></div>
  <div id="meta" class="meta"></div>
  <div id="list" class="list"></div>

  <div id="ctxMenu" class="ctxMenu" hidden></div>

  <script src="window.js"></script>
</body>
</html>
